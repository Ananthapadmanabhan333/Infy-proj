# Local development profile — NEVER use in production. Activate with SPRING_PROFILES_ACTIVE=local.
# Values here are development-only placeholders; production values come from the hosting provider's secret store.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus360}
    username: ${DATABASE_USER:nexus}
    password: ${DATABASE_PASSWORD:nexus_dev_password}

app:
  security:
    jwt-secret: ${JWT_SECRET:local-development-only-jwt-secret-not-for-production-use}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  demo:
    seed: ${APP_DEMO_SEED:true}
    password: ${APP_DEMO_PASSWORD:Nexus360-Demo!}
    show-password: ${APP_DEMO_SHOW_PASSWORD:true}
  integrations:
    allow-private-targets: true
  # Release 4: simulation mode may be switched on locally (Settings → Simulation mode).
  simulation:
    allowed: ${SIMULATION_ALLOWED:true}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  # Every developer and end-to-end test shares 127.0.0.1, so the per-IP sign-in budget is wider than production's 10/min.
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:120}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:5000}
    inbound-per-minute: ${RATE_LIMIT_INBOUND_PER_MINUTE:600}

logging:
  level:
    com.nexus360: DEBUG
