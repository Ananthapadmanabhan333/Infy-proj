server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Docker's embedded DNS; resolving at request time means nginx still starts
  # when the "api" container is not present (e.g. static hosting of the image).
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $nexus_api http://api:8080;

  # nginx drops server-level add_header directives in any location that declares its own,
  # so the security headers are repeated in every location below.

  # Same-origin API proxy so the HttpOnly refresh cookie works in the compose stack.
  location /api/ {
    proxy_pass $nexus_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    client_max_body_size 6m;
  }

  # Live notifications (Server-Sent Events): stream unbuffered and keep the connection open.
  location = /api/notifications/stream {
    proxy_pass $nexus_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
